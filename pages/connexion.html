<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - AutoRoute</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Menu simple -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">AutoRoute</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogue.html">Voitures</a></li>
          <li class="nav-item"><a class="nav-link" href="inscription.html">Inscription</a></li>
          <li class="nav-item"><a class="nav-link active" href="connexion.html">Connexion</a></li>
          <li class="nav-item"><a class="nav-link" href="apropos.html">À propos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4">
          <h1 class="h3 mb-4">Connexion client</h1>

          <form id="loginForm">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Adresse e-mail</label>
              <input type="email" id="loginEmail" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label">Mot de passe</label>
              <input type="password" id="loginPassword" class="form-control" required />
            </div>

            <button type="submit" class="btn btn-success w-100">Se connecter</button>
          </form>

          <div id="loginMsg" class="mt-3"></div>

          <p class="mt-3 mb-0 small text-center">
            Pas encore de compte ? <a href="inscription.html">Créer un compte</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white py-3 mt-5 text-center">
    <div class="container">
      <small>© 2026 AutoRoute</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
