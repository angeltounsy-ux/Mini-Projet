<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription - AutoRoute</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Menu simple -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="../index.html">AutoRoute</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogue.html">Voitures</a></li>
          <li class="nav-item"><a class="nav-link active" href="inscription.html">Inscription</a></li>
          <li class="nav-item"><a class="nav-link" href="connexion.html">Connexion</a></li>
          <li class="nav-item"><a class="nav-link" href="apropos.html">À propos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h1 class="h3 mb-4">Créer un compte client</h1>

          <form id="registerForm">
            <div class="mb-3">
              <label for="regNom" class="form-label">Nom complet</label>
              <input type="text" id="regNom" class="form-control" placeholder="Ex: Youssef Ben Ali" required />
            </div>

            <div class="mb-3">
              <label for="regEmail" class="form-label">Adresse e-mail</label>
              <input type="email" id="regEmail" class="form-control" placeholder="exemple@mail.com" required />
            </div>

            <div class="mb-3">
              <label for="regPermis" class="form-label">Numéro de permis de conduire</label>
              <input type="text" id="regPermis" class="form-control" placeholder="Ex: 123456/24" required />
            </div>

            <div class="mb-3">
              <label for="regPassword" class="form-label">Mot de passe (6 caractères minimum)</label>
              <input type="password" id="regPassword" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="regConfirm" class="form-label">Confirmer le mot de passe</label>
              <input type="password" id="regConfirm" class="form-control" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
          </form>

          <div id="registerMsg" class="mt-3"></div>

          <p class="mt-3 mb-0 small text-center">
            Déjà inscrit ? <a href="connexion.html">Se connecter</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white py-3 mt-5 text-center">
    <div class="container">
      <small>© 2026 AutoRoute </small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
